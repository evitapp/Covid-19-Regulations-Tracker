name: theme_example
version: 1.0.0+1

environment:
  sdk: ">=2.7.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.0

  # display photos in grid
  flutter_staggered_grid_view: ^0.3.3

  # state management
  provider: ^4.3.2+3
  syncfusion_flutter_calendar: ^19.4.50
  searchfield: ^0.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.9.2

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true

  assets:
    - lib/assets/flags/